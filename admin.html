<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | VUSANI IKHAYA PROPERTIES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #edf4ee;
      color: #17201b;
    }
    .topbar {
      background: #101713;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar a { color: #fff; text-decoration: none; }
    .brand { font-weight: 900; font-size: 20px; }
    .brand small { color: rgba(255,255,255,0.7); font-size: 12px; display: block; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .login-box {
      max-width: 400px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    .login-box h2 { margin-top: 0; }
    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cad8cf;
      border-radius: 8px;
      font-size: 16px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #0f7a5f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .login-box button:hover { background: #095741; }
    .error { color: #b8493b; background: #fde5df; padding: 10px; border-radius: 6px; display: none; margin-top: 10px; }
    .error.show { display: block; }
    .panel { display: none; }
    .panel.show { display: block; }
    .top-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .top-actions button {
      padding: 8px 16px;
      border: 1px solid #cad8cf;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .top-actions button.active {
      background: #0f7a5f;
      color: #fff;
      border-color: #0f7a5f;
    }
    .room-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #cad8cf;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 16px;
    }
    .room-card .images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .room-card .images img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      background: #eef3ee;
    }
    .room-card .info { display: grid; gap: 6px; }
    .room-card .info .title { font-weight: 700; font-size: 18px; }
    .room-card .info .detail { font-size: 14px; color: #637268; }
    .room-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .room-card .actions button {
      padding: 5px 12px;
      border: 1px solid #cad8cf;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .room-card .actions .approve { background: #0f7a5f; color: #fff; border-color: #0f7a5f; }
    .room-card .actions .decline { background: #b8493b; color: #fff; border-color: #b8493b; }
    .room-card .actions .delete { background: #b8493b; color: #fff; border-color: #b8493b; }
    .room-card .actions .repost { background: #e5a638; color: #fff; border-color: #e5a638; }
    .empty { color: #637268; text-align: center; padding: 40px; }
    .notice {
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
      font-weight: 600;
    }
    .notice.show { display: block; }
    .notice.success { background: #dbf4e9; color: #0d4c3a; }
    .notice.error { background: #fde5df; color: #7f2318; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.approved { background: #d1fae5; color: #065f46; }
    .badge.taken { background: #dbeafe; color: #1e40af; }
    .badge.declined { background: #fee2e2; color: #991b1b; }
    .badge.removed { background: #f3f4f6; color: #4b5563; }
    @media (max-width: 600px) {
      .room-card { grid-template-columns: 1fr; }
      .room-card .images { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    VUSANI IKHAYA PROPERTIES
    <small>Trusted rooms. Real people. Real value.</small>
  </div>
  <a href="/" style="color:rgba(255,255,255,0.7);">View Public Site</a>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen" class="login-box">
    <h2>🔐 Admin Login</h2>
    <p style="color:#637268;font-size:14px;">Log in to approve new room posts, decline posts, remove public rooms, and repost removed rooms.</p>
    <form id="loginForm">
      <div style="margin-bottom:16px;">
        <label style="display:block;margin-bottom:6px;font-weight:700;">Password</label>
        <input type="password" id="adminPassword" placeholder="Enter admin password" required>
      </div>
      <div id="loginError" class="error"></div>
      <button type="submit">Log In</button>
      <p style="font-size:12px;color:#637268;margin-top:12px;">Use the admin password provided by Vusani Ikhaya Properties.</p>
    </form>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
      <h2 style="margin:0;">📋 Admin Dashboard</h2>
      <div style="display:flex;gap:10px;">
        <button onclick="refreshData()" style="padding:8px 16px;border:1px solid #cad8cf;border-radius:6px;background:#fff;cursor:pointer;font-weight:600;">🔄 Refresh</button>
        <button onclick="logout()" style="padding:8px 16px;border:1px solid #b8493b;border-radius:6px;background:#b8493b;color:#fff;cursor:pointer;font-weight:600;">🚪 Log Out</button>
      </div>
    </div>

    <div id="notice" class="notice"></div>

    <!-- TABS -->
    <div class="top-actions">
      <button class="active" data-tab="pending" onclick="switchTab('pending')">⏳ Pending (<span id="pendingCount">0</span>)</button>
      <button data-tab="approved" onclick="switchTab('approved')">✅ Approved (<span id="approvedCount">0</span>)</button>
      <button data-tab="taken" onclick="switchTab('taken')">📦 Taken (<span id="takenCount">0</span>)</button>
      <button data-tab="declined" onclick="switchTab('declined')">❌ Declined (<span id="declinedCount">0</span>)</button>
      <button data-tab="removed" onclick="switchTab('removed')">🗑️ Removed (<span id="removedCount">0</span>)</button>
    </div>

    <div id="roomList"></div>
  </div>

</div>

<script>
  // ========================================
  // SESSION KEY - DEFINED FIRST!
  // ========================================
  const SESSION_KEY = "adminSession";
  const ADMIN_PASSWORD = "Av98012@12";

  let currentTab = 'pending';
  let allRooms = { pending: [], approved: [], taken: [], declined: [], removed: [] };
  let adminToken = null;

  // ========================================
  // DOM REFS
  // ========================================
  const loginScreen = document.getElementById('loginScreen');
  const adminPanel = document.getElementById('adminPanel');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const roomList = document.getElementById('roomList');
  const notice = document.getElementById('notice');

  // ========================================
  // LOGIN
  // ========================================
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('adminPassword').value;
    loginError.classList.remove('show');

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      if (data.token) {
        adminToken = data.token;
        localStorage.setItem('adminToken', adminToken);
        sessionStorage.setItem(SESSION_KEY, 'yes');
        showAdminPanel();
      } else {
        loginError.textContent = data.error || 'Invalid password';
        loginError.classList.add('show');
      }
    } catch (err) {
      loginError.textContent = 'Server error. Please try again.';
      loginError.classList.add('show');
    }
  });

  // ========================================
  // SHOW ADMIN PANEL
  // ========================================
  function showAdminPanel() {
    loginScreen.style.display = 'none';
    adminPanel.classList.add('show');
    loadData();
  }

  // ========================================
  // LOAD DATA
  // ========================================
  async function loadData() {
    const token = localStorage.getItem('adminToken');
    if (!token) { logout(); return; }

    try {
      const res = await fetch('/api/admin/data', {
        headers: { 'Authorization': 'Bearer ' + token }
      });

      if (res.status === 401) {
        logout();
        return;
      }

      const data = await res.json();
      if (data.rooms) {
        allRooms = data.rooms;
        updateCounts();
        renderRooms(currentTab);
      }
    } catch (err) {
      showNotice('Failed to load data', 'error');
    }
  }

  // ========================================
  // RENDER ROOMS
  // ========================================
  function renderRooms(tab) {
    const rooms = allRooms[tab] || [];
    currentTab = tab;

    if (rooms.length === 0) {
      roomList.innerHTML = `<div class="empty">No rooms in ${tab}</div>`;
      return;
    }

    let html = '';
    rooms.forEach(room => {
      const images = room.images || [];
      const imgHtml = images.length > 0
        ? images.map(img => `<img src="${img}" alt="Room" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22100%22%3E%3Crect fill=%22%23edf4ee%22 width=%22200%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2250%22 fill=%22%23637268%22 font-size=%2214%22%3ENo image%3C/text%3E%3C/svg%3E'">`).join('')
        : '<div style="background:#edf4ee;height:100px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#637268;font-size:12px;">No image</div>';

      const statusBadge = `<span class="badge ${tab}">${tab}</span>`;

      html += `
        <div class="room-card">
          <div class="images">${imgHtml}</div>
          <div class="info">
            <div class="title">${room.title || 'Untitled'}</div>
            <div class="detail">📍 ${room.location || 'No location'} | 💰 ${room.amount || 'Ask price'}</div>
            <div class="detail">${statusBadge} ${room.address || ''}</div>
            <div class="actions">
              ${tab === 'pending' ? `<button class="approve" onclick="moveRoom('${room.id}','pending','approved')">✅ Approve</button>` : ''}
              ${tab === 'pending' ? `<button class="decline" onclick="moveRoom('${room.id}','pending','declined')">❌ Decline</button>` : ''}
              ${tab === 'approved' ? `<button class="decline" onclick="moveRoom('${room.id}','approved','declined')">❌ Decline</button>` : ''}
              ${tab === 'approved' ? `<button onclick="moveRoom('${room.id}','approved','taken')">📦 Mark Taken</button>` : ''}
              ${tab === 'approved' ? `<button class="delete" onclick="deleteRoom('${room.id}','approved')">🗑️ Delete</button>` : ''}
              ${tab === 'declined' ? `<button class="repost" onclick="moveRoom('${room.id}','declined','pending')">🔄 Repost</button>` : ''}
              ${tab === 'declined' ? `<button class="delete" onclick="deleteRoom('${room.id}','declined')">🗑️ Delete</button>` : ''}
              ${tab === 'taken' ? `<button class="delete" onclick="deleteRoom('${room.id}','taken')">🗑️ Delete</button>` : ''}
              ${tab === 'removed' ? `<button class="repost" onclick="moveRoom('${room.id}','removed','pending')">🔄 Repost</button>` : ''}
              ${tab === 'removed' ? `<button class="delete" onclick="deleteRoom('${room.id}','removed')">🗑️ Delete</button>` : ''}
            </div>
          </div>
        </div>
      `;
    });

    roomList.innerHTML = html;
  }

  // ========================================
  // MOVE ROOM (Approve/Decline/Repost)
  // ========================================
  async function moveRoom(id, from, to) {
    const token = localStorage.getItem('adminToken');
    if (!token) return;

    try {
      const res = await fetch('/api/admin/action', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
          action: 'move',
          section: 'rooms',
          from: from,
          to: to,
          id: id
        })
      });
      const data = await res.json();
      if (data.ok) {
        showNotice(`✅ Room moved to ${to}`, 'success');
        loadData();
      } else {
        showNotice(data.error || 'Action failed', 'error');
      }
    } catch (err) {
      showNotice('Action failed', 'error');
    }
  }

  // ========================================
  // DELETE ROOM
  // ========================================
  async function deleteRoom(id, from) {
    if (!confirm('⚠️ Delete this room permanently?')) return;

    const token = localStorage.getItem('adminToken');
    if (!token) return;

    try {
      const res = await fetch('/api/admin/action', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
          action: 'delete',
          section: 'rooms',
          from: from,
          id: id
        })
      });
      const data = await res.json();
      if (data.ok) {
        showNotice('🗑️ Room deleted', 'success');
        loadData();
      } else {
        showNotice(data.error || 'Delete failed', 'error');
      }
    } catch (err) {
      showNotice('Delete failed', 'error');
    }
  }

  // ========================================
  // SWITCH TAB
  // ========================================
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.top-actions button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    renderRooms(tab);
  }

  // ========================================
  // UPDATE COUNTS
  // ========================================
  function updateCounts() {
    ['pending', 'approved', 'taken', 'declined', 'removed'].forEach(tab => {
      const el = document.getElementById(tab + 'Count');
      if (el) el.textContent = (allRooms[tab] || []).length;
    });
  }

  // ========================================
  // REFRESH DATA
  // ========================================
  function refreshData() {
    loadData();
    showNotice('🔄 Refreshed', 'success');
  }

  // ========================================
  // SHOW NOTICE
  // ========================================
  function showNotice(msg, type = 'success') {
    notice.textContent = msg;
    notice.className = 'notice show ' + type;
    setTimeout(() => notice.classList.remove('show'), 4000);
  }

  // ========================================
  // LOGOUT
  // ========================================
  function logout() {
    const token = localStorage.getItem('adminToken');
    if (token) {
      fetch('/api/admin/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).catch(() => {});
    }
    localStorage.removeItem('adminToken');
    sessionStorage.removeItem(SESSION_KEY);
    adminToken = null;
    loginScreen.style.display = 'block';
    adminPanel.classList.remove('show');
    document.getElementById('adminPassword').value = '';
  }

  // ========================================
  // CHECK SESSION ON LOAD
  // ========================================
  if (sessionStorage.getItem(SESSION_KEY) === 'yes') {
    const token = localStorage.getItem('adminToken');
    if (token) {
      adminToken = token;
      showAdminPanel();
    } else {
      sessionStorage.removeItem(SESSION_KEY);
    }
  }

  // ========================================
  // CHECK SESSION ON FOCUS
  // ========================================
  window.addEventListener('focus', () => {
    if (sessionStorage.getItem(SESSION_KEY) === 'yes') {
      const token = localStorage.getItem('adminToken');
      if (token) {
        fetch('/api/admin/check-session', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => r.json())
        .then(data => {
          if (!data.valid) logout();
        })
        .catch(() => {});
      }
    }
  });

  console.log('✅ Admin panel loaded');
  console.log('🔑 Password: ' + ADMIN_PASSWORD);
</script>

</body>
</html>
